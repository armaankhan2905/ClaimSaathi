services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: claim_sathi
      POSTGRES_PASSWORD: "GRkr2Y5DtfirLn3xUfOZQiDLpTozY5TL"
    volumes:
      - claim_sathi_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "8dMuy1YhRpjlliDHK2o40Z6baVhi9L5V"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: claim_sathi_test
      POSTGRES_PASSWORD: "yfKv9IzC92CJGSWeeJkWHYsQ2qRdn2-p"
    volumes:
      - claim_sathi_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "v2942uUrfliFLUXOecACRHZfs2UqbaQ3"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  claim_sathi_data:
  claim_sathi_test_data:
