<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ClaimSaathi explains your insurance policy in plain language and helps you check rejected claims." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Courier+Prime:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap"
    />
    <title>ClaimSaathi</title>
    <script>
      // Set the theme before first paint so the page doesn't flash.
      // Light is the default; dark only if the user picked it with the toggle.
      (function () {
        var t = null;
        try { t = localStorage.getItem("claimsaathi-theme"); } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
